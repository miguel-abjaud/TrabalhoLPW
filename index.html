<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundBox</title>
    <link rel="icon" type="image/png" href="imagens/icone_caixa.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="main-header">
        <h1> SoundBox</h1>
        <div class="user-controls">
            <span id="perfil-atual-nome">Usuário: </span>
            <button id="btn-trocar-perfil" class="btn-secondary">Trocar Perfil</button>
            <button id="btn-sobre" class="btn-secondary">Sobre</button>
        </div>
    </header>

     <div class="container">
        
      
        <div class="card">
            <h3>Adicionar Música</h3>
            <form id="form-musica">
                <div class="form-group">
                    <input type="text" id="titulo" placeholder="Título da música" required>
                </div>
                <div class="form-group">
                    <input type="text" id="artista" placeholder="Artista" required>
                </div>
                <div class="form-group">
                    <select id="categoria" required>
                        <option value="Rock">Rock</option>
                        <option value="Pop">Pop</option>
                        <option value="MPB">MPB</option>
                    </select>
    
    <h3>Minhas Músicas</h3>
    <button onclick="limparTudo()">Limpar Tudo</button><br><br>
    <div id="lista"></div>

    <script src="script.js"></script>
</body>
</html>
