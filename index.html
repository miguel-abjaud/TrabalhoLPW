<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SoundBox</title>
  <link rel="icon" type="image/png" href="imagens/icone_caixa.png">
</head>
<body>

    <h1>SoundBox</h1>
    
    <h3>Adicionar Música</h3>
    <form id="form-musica">
        <input type="text" id="titulo" placeholder="Título da música" required><br><br>
        <input type="text" id="artista" placeholder="Artista" required><br><br>
        <select id="categoria">
            <option value="Rock">Rock</option>
            <option value="Pop">Pop</option>
            <option value="MPB">MPB</option>
        </select><br><br>
        <button type="submit">Salvar</button>
    </form>

    <hr>

    <h3>Minhas Músicas</h3>
    <button onclick="limparTudo()">Limpar Tudo</button><br><br>
    <div id="lista"></div>

    <script src="script.js"></script>
</body>
</html>
